name: Desktop foundation CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Compile fixed application-owned Python source on each platform.
      # This does NOT imply we have downloaded third-party model weights or
      # verified a user's external ONNX / Python dependency environment.
      - name: Set up Python for neural worker syntax check
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate offline Python neural worker syntax
        run: python -m py_compile scripts/neural-inference-worker.py

      - name: Run unit tests
        run: npm test

      - name: Build desktop bundles
        run: npx electron-vite build

      - name: Verify offline embedding Worker inside desktop bundle
        run: node scripts/verify-offline-worker.mjs
